name: gainit
description: "GainIt — local-first hypertrophy tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.3
  timezone: ^0.11.1
  uuid: ^4.6.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.2
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
