name: gainit
description: "GainIt — local-first hypertrophy tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned: test/helpers/localization.dart loads translations through its
  # internal API; check that helper before upgrading.
  easy_localization: 3.0.8
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  timezone: ^0.11.1
  uuid: ^4.6.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  video_player: ^2.14.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  animations: ^3.0.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.2
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/exercise_guides/
    - assets/icon/splash_logo.png
    - assets/translations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    # Arabic text: Poppins has no Arabic glyphs.
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700

# App icon: `dart run flutter_launcher_icons` after changing assets/icon/.
# The images are drawn by a script (a placeholder until a designed icon).
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#C8102E"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # The foreground is already drawn inside the adaptive icon's safe zone.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true

# Native launch screen: `dart run flutter_native_splash:create` after
# changing it. The app is always dark, so the splash is too; the in-app
# splash (SplashView) continues from the same logo.
flutter_native_splash:
  color: "#0D0F12"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0D0F12"
    image: assets/icon/splash_android12.png
    icon_background_color: "#C8102E"
